<div class="profile-edit__file" data-profile-file="{{ widget.name }}">
    {% include 'django/forms/widgets/input.html' %}
    <label for="{{ widget.attrs.id }}" class="btn btn--outline btn--sm profile-edit__file-button">
        {% if widget.is_initial %}Заменить{% else %}Выбрать файл{% endif %}
    </label>
    <span class="form-page__hint profile-edit__file-name" aria-live="polite"></span>
    {% if widget.is_initial and not widget.required %}
        <label class="checkbox-label profile-edit__file-clear">
            <input type="checkbox" name="{{ widget.checkbox_name }}" id="{{ widget.checkbox_id }}"
                   {% if widget.attrs.disabled %}disabled{% endif %}{% if widget.attrs.checked %} checked{% endif %}>
            {{ widget.clear_checkbox_label }}
        </label>
    {% endif %}
</div>
