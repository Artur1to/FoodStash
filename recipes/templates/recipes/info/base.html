{% extends 'recipes/base.html' %}

{% block title %}{{ page_title }} — FoodStash{% endblock %}

{% block content %}
<div class="container info-page">
    <nav class="info-page__nav" aria-label="Информация о проекте">
        {% with route=request.resolver_match.url_name %}
            <a href="{% url 'about' %}"{% if route == 'about' %} aria-current="page"{% endif %}>О проекте</a>
            <a href="{% url 'terms' %}"{% if route == 'terms' %} aria-current="page"{% endif %}>Правила</a>
            <a href="{% url 'privacy' %}"{% if route == 'privacy' %} aria-current="page"{% endif %}>Конфиденциальность</a>
            <a href="{% url 'cookies' %}"{% if route == 'cookies' %} aria-current="page"{% endif %}>Cookie</a>
        {% endwith %}
    </nav>
    <article class="info-page__article">
        <h1 class="page-title">{{ page_title }}</h1>
        {% block info_content %}{% endblock %}
    </article>
</div>
{% endblock %}
